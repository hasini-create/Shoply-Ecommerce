<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KLECommerce - Login</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="auth-body">


<div class="auth-container">


    <div class="auth-box">

        <div class="auth-logo">
            KLECommerce
        </div>


        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your account
        </p>


        <form id="loginForm">


            <label>
                Email
            </label>

            <input type="email"
                   id="loginEmail"
                   placeholder="Enter your email"
                   required>


            <label>
                Password
            </label>

            <input type="password"
                   id="loginPassword"
                   placeholder="Enter your password"
                   required>


            <button type="submit"
                    class="auth-button">

                Login

            </button>


            <p id="loginMessage"
               class="message">
            </p>


        </form>


        <p class="account-text">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>


        <a href="index.html"
           class="back">

            ← Back to Home

        </a>

    </div>

</div>


<script src="auth.js"></script>

</body>

</html>
