<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KLECommerce - Register</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="auth-body">


<div class="auth-container">


    <div class="auth-box">

        <div class="auth-logo">
            KLECommerce
        </div>


        <h1>
            Create Account
        </h1>

        <p>
            Register to start shopping
        </p>


        <form id="registerForm">


            <label>
                Full Name
            </label>

            <input type="text"
                   id="name"
                   placeholder="Enter your full name"
                   required>


            <label>
                Email
            </label>

            <input type="email"
                   id="email"
                   placeholder="Enter your email"
                   required>


            <label>
                Phone Number
            </label>

            <input type="tel"
                   id="phone"
                   placeholder="Enter 10 digit phone number"
                   pattern="[0-9]{10}"
                   required>


            <label>
                Password
            </label>

            <input type="password"
                   id="password"
                   placeholder="Enter password"
                   minlength="6"
                   required>


            <label>
                Confirm Password
            </label>

            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm password"
                   minlength="6"
                   required>


            <button type="submit"
                    class="auth-button">

                Register

            </button>


            <p id="registerMessage"
               class="message">
            </p>


        </form>


        <p class="account-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="index.html"
           class="back">

            ← Back to Home

        </a>

    </div>

</div>


<script src="auth.js"></script>

</body>

</html>
